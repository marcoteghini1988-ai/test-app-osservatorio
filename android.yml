name: Compila MyBotRun Osservatore Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accetta licenze e installa Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1
          set -o pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compila APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MyBotRun-Osservatore-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
