name: Compila Osservatore da ZIP sul telefono
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK e licenze
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1
          set -o pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Estrai progetto dal file ZIP
        run: |
          mkdir -p codice
          unzip -q MyBotRun_Osservatore_Android_v1_SORGENTE.zip -d codice
      - name: Compila APK
        working-directory: codice
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyBotRun-Osservatore-Android-APK
          path: codice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
